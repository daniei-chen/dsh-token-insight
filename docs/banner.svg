<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="DSH Token Insight">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="220" fill="#4C8DFF" opacity="0.08"/>
  <circle cx="980" cy="340" r="180" fill="#34D399" opacity="0.06"/>

  <!-- grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M60 0V360M180 0V360M300 0V360M420 0V360M540 0V360M660 0V360M780 0V360M900 0V360M1020 0V360M1140 0V360"/>
  </g>

  <g transform="translate(64 54)">
    <rect x="0" y="0" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
    <text x="75" y="20" text-anchor="middle" font-family="Inter,Segoe UI,PingFang SC,sans-serif" font-size="11" letter-spacing="2" fill="#9CC4FF">DEEPSEEK HARNESS</text>

    <text x="0" y="92" font-family="Inter,Segoe UI,PingFang SC,sans-serif" font-size="50" font-weight="700" fill="#FFFFFF">DSH Token Insight</text>
    <text x="2" y="130" font-family="Inter,Segoe UI,PingFang SC,sans-serif" font-size="18" fill="#A9B7D0">把每一颗 token，都看得清清楚楚。</text>

    <g transform="translate(0 164)" font-family="Inter,Segoe UI,PingFang SC,sans-serif" font-size="12">
      <rect x="0" y="0" width="92" height="28" rx="14" fill="#4C8DFF" fill-opacity="0.16" stroke="#4C8DFF" stroke-opacity="0.45"/>
      <text x="46" y="18" text-anchor="middle" fill="#BFD7FF">本地优先</text>
      <rect x="104" y="0" width="112" height="28" rx="14" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/>
      <text x="160" y="18" text-anchor="middle" fill="#B8F3D8">52 周热力图</text>
      <rect x="228" y="0" width="104" height="28" rx="14" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.35"/>
      <text x="280" y="18" text-anchor="middle" fill="#FCE7B2">模型分析</text>
      <rect x="344" y="0" width="92" height="28" rx="14" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.38"/>
      <text x="390" y="18" text-anchor="middle" fill="#E4D9FF">零遥测</text>
    </g>
  </g>

  <!-- dashboard card -->
  <g transform="translate(748 58)">
    <rect width="392" height="244" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="0" y="0" width="392" height="44" rx="20" fill="#FFFFFF" fill-opacity="0.04"/>
    <circle cx="24" cy="22" r="5" fill="#34D399"/>
    <text x="40" y="27" font-family="Inter,Segoe UI,sans-serif" font-size="12" fill="#C9D6EA">使用统计 · 近 30 日</text>
    <text x="336" y="27" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#7F91AD">本地数据</text>

    <g transform="translate(20 64)" font-family="Inter,Segoe UI,PingFang SC,sans-serif">
      <text x="0" y="0" font-size="10" fill="#8494AE">累计 Token</text>
      <text x="0" y="30" font-size="28" font-weight="700" fill="#FFFFFF">75.0 亿</text>

      <text x="128" y="0" font-size="10" fill="#8494AE">峰值 Token</text>
      <text x="128" y="30" font-size="24" font-weight="700" fill="#FFFFFF">15.0 亿</text>

      <text x="250" y="0" font-size="10" fill="#8494AE">缓存命中</text>
      <text x="250" y="30" font-size="24" font-weight="700" fill="#34D399">98.2%</text>

      <!-- heatmap -->
      <g transform="translate(0 56)">
        <text x="0" y="0" font-size="10" fill="#8494AE">Token 活动</text>
        <g transform="translate(0 10)">
          <rect x="0" y="0" width="12" height="12" rx="2" fill="#1E3A5F"/>
          <rect x="16" y="0" width="12" height="12" rx="2" fill="#1E3A5F"/>
          <rect x="32" y="0" width="12" height="12" rx="2" fill="#1D4ED8"/>
          <rect x="48" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
          <rect x="64" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="80" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
          <rect x="96" y="0" width="12" height="12" rx="2" fill="#1E3A5F"/>
          <rect x="112" y="0" width="12" height="12" rx="2" fill="#1D4ED8"/>
          <rect x="128" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="144" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
        </g>
        <g transform="translate(0 28)">
          <rect x="0" y="0" width="12" height="12" rx="2" fill="#1D4ED8"/>
          <rect x="16" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="32" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="48" y="0" width="12" height="12" rx="2" fill="#1E3A5F"/>
          <rect x="64" y="0" width="12" height="12" rx="2" fill="#1D4ED8"/>
          <rect x="80" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
          <rect x="96" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="112" y="0" width="12" height="12" rx="2" fill="#3B82F6"/>
          <rect x="128" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
          <rect x="144" y="0" width="12" height="12" rx="2" fill="#1D4ED8"/>
        </g>
      </g>

      <!-- mini trend -->
      <g transform="translate(196 58)">
        <text x="0" y="0" font-size="10" fill="#8494AE">每日趋势</text>
        <path d="M0 44 L20 38 L40 40 L60 22 L80 30 L100 18 L120 24 L140 12 L160 18" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0 44 L20 38 L40 40 L60 22 L80 30 L100 18 L120 24 L140 12 L160 18 L160 52 L0 52 Z" fill="#4C8DFF" fill-opacity="0.10"/>
        <circle cx="160" cy="18" r="3" fill="#4C8DFF"/>
      </g>
    </g>
  </g>

  <g transform="translate(64 300)" font-family="Inter,Segoe UI,sans-serif" font-size="11" fill="#7186A3">
    <text x="0" y="0">read-only · local-first · no telemetry</text>
    <text x="960" y="0" text-anchor="end">github.com/daniei-chen/dsh-token-insight</text>
  </g>
</svg>
